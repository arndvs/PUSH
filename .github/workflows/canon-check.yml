name: Canon Check

# Runs the canon integrity checker on every PR that touches markdown, and on
# pushes to the default branch (catches drift introduced directly to main).
# The Prop Bible is the single source of truth; this workflow makes that
# boundary machine-checkable (see .sandcastle/canon-facts.json + README
# "Document Hierarchy").
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".sandcastle/canon-facts.json"
      - "scripts/canon-check.py"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".sandcastle/canon-facts.json"
      - "scripts/canon-check.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canon-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run canon-check
        run: python3 scripts/canon-check.py